name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: cybergrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cybergrid_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run lint

      - name: Inicializar esquema oficial y ejecutar toda la suite
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/cybergrid_test
        run: |
          npm run db:init
          npm test

      - name: Build de producción
        env:
          NODE_ENV: production
        run: npm run build

      - name: Instalar Chromium para E2E
        timeout-minutes: 5
        run: |
          # The Azure package mirror stalled dependency downloads in CI.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\n' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99cybergrid-ci > /dev/null
          npx playwright install --with-deps --only-shell chromium

      - name: Recorridos E2E con PostgreSQL real
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@127.0.0.1:5432/cybergrid_test
        run: npm run test:e2e

      - name: Conservar capturas y trazas de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore
