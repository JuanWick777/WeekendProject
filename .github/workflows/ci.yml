name: Bootstrap checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cybergrid_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Crear .env para entorno CI
        run: touch .env
      - name: Inicializar esquema de BD
        env:
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/cybergrid_test
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/cybergrid_test
        run: npm run db:init
      - name: Ejecutar verificaciones (Lint, Test, Build)
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/cybergrid_test
          TEST_DATABASE_URL: postgres://postgres:postgrespassword@localhost:5432/cybergrid_test
          SESSION_SECRET: test_session_secret_key_32_chars_min!!
        run: npm run verify