name: Bootstrap checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run verify

      # C3: agregar servicio PostgreSQL aislado, instalar Chromium y ejecutar
      # npm run test:e2e cuando existan auth.spec.js, lobby.spec.js y gameplay.spec.js.
      # Este workflow inicial NO representa la suite completa de la rúbrica.
